# Copy to secrets.toml after creating a regular web application with your identity provider.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
client_id = "replace-with-application-client-id"
client_secret = "replace-with-application-client-secret"
server_metadata_url = "https://YOUR-TENANT/.well-known/openid-configuration"
